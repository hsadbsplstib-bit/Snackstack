                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const raw = input.value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(!raw){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    statusEl.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Enter ingredients first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const userIngredients =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    extractIngredients(raw);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    statusEl.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Analyzing your kitchen inventory...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipeCard.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const best = findBestRecipe(userIngredients);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await spinAnimation(best.recipe.name);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    statusEl.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Recipe generated successfully.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    renderRecipe(best,userIngredients);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
