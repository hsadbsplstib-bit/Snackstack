                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    name:"Butter Garlic Chicken Wrap",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ingredients:["chicken","garlic","butter","tortilla","onion"],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    time:"22 mins",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    difficulty:"Medium",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    steps:[

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Add onions and sauté.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Fill tortilla tightly.",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const input = document.getElementById("ingredientsInput");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const spinBtn = document.getElementById("spinBtn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const track = document.getElementById("track");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const statusEl = document.getElementById("status");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const recipeCard = document.getElementById("recipeCard");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const recipeName = document.getElementById("recipeName");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const cookTime = document.getElementById("cookTime");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const difficulty = document.getElementById("difficulty");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const scoreEl = document.getElementById("score");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const matchedText = document.getElementById("matchedText");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const ingredientsList = document.getElementById("ingredientsList");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const stepsList = document.getElementById("stepsList");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function normalize(text){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return text.toLowerCase().trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function extractIngredients(text){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return text
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .toLowerCase()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .replace(/\n/g,",")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .split(",")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .map(i=>i.trim())
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .filter(i=>i.length>0);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function findBestRecipe(userIngredients){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let bestRecipe = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let highestScore = -1;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipes.forEach(recipe=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let score = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipe.ingredients.forEach(item=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(userIngredients.includes(item)){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    score += 3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    userIngredients.forEach(userItem=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(item.includes(userItem) || userItem.includes(item)){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    score += 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(score > highestScore){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    highestScore = score;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    bestRecipe = recipe;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipe:bestRecipe,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    score:highestScore
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function spinAnimation(finalName){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    track.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const names = recipes.map(r=>r.name);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    for(let i=0;i<30;i++){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const div = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.className = "item";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    names[Math.floor(Math.random()*names.length)];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    track.appendChild(div);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const finalDiv = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    finalDiv.className = "item";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    finalDiv.textContent = finalName;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    track.appendChild(finalDiv);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let position = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let speed = 55;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return new Promise(resolve=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const interval = setInterval(()=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    position += speed;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    speed *= .95;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    track.style.transform =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `translateY(-${position}px)`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(speed < 1){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    clearInterval(interval);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const finalPos =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    (track.children.length-1)*100;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    track.style.transform =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `translateY(-${finalPos}px)`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    setTimeout(resolve,500);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    },35);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function renderRecipe(data,userIngredients){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const recipe = data.recipe;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipeCard.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipeName.textContent = recipe.name;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    cookTime.textContent = `⏱ ${recipe.time}`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    difficulty.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `🔥 ${recipe.difficulty}`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    scoreEl.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `🎯 Match Score: ${data.score}`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const matched =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipe.ingredients.filter(i=>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    userIngredients.some(u=>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    i.includes(u) || u.includes(i)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    matchedText.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `Matched Ingredients: ${matched.join(", ")}`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ingredientsList.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipe.ingredients.forEach(i=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const div = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.className = "ing";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.textContent = i;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ingredientsList.appendChild(div);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    stepsList.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    recipe.steps.forEach((step,index)=>{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const div = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.className = "step";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="number">${index+1}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>${step}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    stepsList.appendChild(div);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    spinBtn.addEventListener("click",async()=>{
